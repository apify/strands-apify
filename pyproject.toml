[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-apify"
version = "0.2.0"
description = "Apify web scraping, social media, search and automation tools for Strands Agents SDK"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Apify", email = "support@apify.com"}
]
keywords = ["strands", "agents", "ai", "tool", "apify", "web-scraping", "automation", "social-media", "scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "strands-agents>=1.0.0",
    "apify-client>=3.0.0,<4.0.0",
    "impit>=0.14.0,<1.0.0",
    "rich>=13.0.0",
]

[project.urls]
"Homepage" = "https://apify.com"
"Source" = "https://github.com/apify/strands-apify"
"Release Notes" = "https://github.com/apify/strands-apify/releases"
"Issue Tracker" = "https://github.com/apify/strands-apify/issues"
"Changelog" = "https://github.com/apify/strands-apify/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "poethepoet<1.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "pytest-cov<8.0.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strands_apify"]

# Source distribution - explicit allowlist so personal/local-only paths
# (.personal_testing/, .claude/, docs-submission/, etc.) never reach PyPI.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/pyproject.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE",
    "/NOTICE",
    "/llms.txt",
]

# Run tasks with: uv run poe <task>
[tool.poe.tasks]
clean = { cmd = "rm -rf .coverage .mypy_cache .pytest_cache .ruff_cache build dist htmlcov", help = "Remove build artifacts and clean caches" }
install-dev = { cmd = "uv sync", help = "Install development dependencies" }
build = { cmd = "uv build", help = "Build the package" }
type-check = { cmd = "uv run mypy src", help = "Run the type checker" }
unit-tests = { cmd = "uv run pytest tests", help = "Run unit tests" }
unit-tests-cov = { cmd = "uv run pytest --cov=strands_apify --cov-report=xml:coverage-unit.xml tests", help = "Run unit tests with an XML coverage report" }
check-code = { sequence = ["lint", "type-check", "unit-tests"], help = "Run all checks and unit tests" }

[tool.poe.tasks.lint]
shell = "uv run ruff format --check && uv run ruff check"
help = "Run the linter and check formatting"

[tool.poe.tasks.format]
shell = "uv run ruff check --fix && uv run ruff format"
help = "Fix lint issues and format code"

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear
    "UP",    # pyupgrade (Python 3.11+ idioms — auto-fixes Dict→dict, Optional→| None, etc.)
    "SIM",   # simplifications
    "C4",    # comprehensions
    "PIE",   # misc
    "PT",    # pytest style
    "TCH",   # move runtime-only imports under TYPE_CHECKING
    "RUF",   # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
