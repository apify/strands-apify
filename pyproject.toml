[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "strands-apify"
version = "0.2.0"
description = "Apify web scraping, social media, search and automation tools for Strands Agents SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Apify", email = "support@apify.com"}
]
keywords = ["strands", "agents", "ai", "tool", "apify", "web-scraping", "automation", "social-media", "scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "strands-agents>=1.0.0",
    "apify-client>=3.0.0,<4.0.0",
    "impit>=0.14.0,<1.0.0",
    "rich>=13.0.0",
]

[project.urls]
"Homepage" = "https://apify.com"
"Source" = "https://github.com/apify/strands-apify"
"Release Notes" = "https://github.com/apify/strands-apify/releases"
"Issue Tracker" = "https://github.com/apify/strands-apify/issues"
"Changelog" = "https://github.com/apify/strands-apify/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "poethepoet<1.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "pytest-cov<8.0.0",
    "ruff~=0.17.0",
    "ty~=0.0.0",
]

[tool.uv.build-backend]
# The module, pyproject.toml, README and license files are included in the sdist by default.
source-include = [
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "llms.txt",
    "tests/**",
]

# Run tasks with: uv run poe <task>
[tool.poe.tasks]
clean = { cmd = "rm -rf .coverage .pytest_cache .ruff_cache .ty_cache build dist htmlcov", help = "Remove build artifacts and clean caches" }
install-dev = { cmd = "uv sync", help = "Install development dependencies" }
build = { cmd = "uv build", help = "Build the package" }
type-check = { cmd = "uv run ty check", help = "Run the type checker" }
unit-tests = { cmd = "uv run pytest tests", help = "Run unit tests" }
unit-tests-cov = { cmd = "uv run pytest --cov=strands_apify --cov-report=xml:coverage-unit.xml tests", help = "Run unit tests with an XML coverage report" }
check-code = { sequence = ["lint", "type-check", "unit-tests"], help = "Run all checks and unit tests" }

[tool.poe.tasks.lint]
shell = "uv run ruff format --check && uv run ruff check"
help = "Run the linter and check formatting"

[tool.poe.tasks.format]
shell = "uv run ruff check --fix && uv run ruff format"
help = "Fix lint issues and format code"

[tool.ruff]
line-length = 120
include = ["**/*.py", "**/*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in {filename}
    "BLE001",  # Do not catch blind exception
    "C901",    # `{name}` is too complex
    "COM812",  # This rule may cause conflicts when used with the formatter
    "CPY001",  # Missing copyright notice at top of file
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in `__init__`
    "EM",      # flake8-errmsg
    "FIX",     # flake8-fixme
    "G004",    # Logging statement uses f-string
    "ISC001",  # This rule may cause conflicts when used with the formatter
    "PLR0911", # Too many return statements
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements
    "PTH",     # flake8-use-pathlib
    "TD002",   # Missing author in TODO; try: `# TODO(<author_name>): ...` or `# TODO @<author_name>: ...
    "TRY003",  # Avoid specifying long messages outside the exception class
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "F401", # Unused imports
]
"src/strands_apify/{core,search_crawling,social_media}.py" = [
    "TRY301", # Tools validate inside the `try`, so every failure reaches the one `_error_result` handler
]
"**/{tests}/*" = [
    "D",       # Everything from the pydocstyle
    "INP001",  # File {filename} is part of an implicit namespace package, add an __init__.py
    "PLR2004", # Magic value used in comparison, consider replacing {value} with a constant variable
    "S101",    # Use of assert detected
    "S105",    # Possible hardcoded password assigned to: "{name}"
    "S106",    # Possible hardcoded password assigned to argument: "{name}"
    "SLF001",  # Private member accessed: `{name}`
    "T20",     # flake8-print
    "TRY301",  # Abstract `raise` to an inner function
    "TID252",  # Prefer absolute imports over relative imports from parent modules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.flake8-type-checking]
# Strands builds the tool spec from the annotations at runtime, so their imports can't move into a TYPE_CHECKING block.
runtime-evaluated-decorators = ["strands.tool"]

[tool.ruff.lint.pylint]
max-branches = 18

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
